apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk
  namespace: helpdesk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [suporte.msmt.org.br]
      secretName: helpdesk-tls
  rules:
    - host: suporte.msmt.org.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk
                port:
                  name: http
