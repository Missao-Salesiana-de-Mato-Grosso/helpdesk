apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
  namespace: helpdesk
  labels:
    app: helpdesk
spec:
  # 1 réplica: os crons (outbox de e-mail e leitura do IMAP) rodam no processo. A outbox aguenta
  # mais de uma réplica (SKIP LOCKED), a leitura da caixa não deve rodar em paralelo.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: helpdesk
  template:
    metadata:
      labels:
        app: helpdesk
    spec:
      imagePullSecrets:
        - name: registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: helpdesk
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: helpdesk-config
            # Depois do ConfigMap: um valor do Secret prevalece (ex.: NOTIFICATIONS_ENABLED=false sem SMTP).
            - secretRef:
                name: helpdesk-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
