apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Nome fixo (sem hash): o Job de migração aponta para ele. O deploy faz rollout restart a cada aplicação.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: helpdesk-config
    namespace: helpdesk
    envs:
      - config.env
      # IDs do Zitadel de produção, gravados por `make zitadel-bootstrap` (não são segredos).
      - zitadel.env
images:
  # A tag é trocada por deploy/prod/app.sh (kustomize edit set image) a cada deploy.
  - name: helpdesk
    newName: container-registry.br-se1.magalu.cloud/cr-msmt-prd/helpdesk
    newTag: latest
